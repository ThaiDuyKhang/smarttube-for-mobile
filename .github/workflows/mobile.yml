name: Build SmartTube Mobile

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publish the release on a version tag

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure release signing
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > "${{ github.workspace }}/key.jks"
          {
            echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "storeFile=${{ github.workspace }}/key.jks"
          } > keystore.properties

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew :smarttubetv:lintStmobileRelease

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: warn

      # Without the signing key the release APK can't be installed. Build the debug one instead.
      - name: Build APK
        run: |
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            ./gradlew :smarttubetv:assembleStmobileRelease
            echo "APK_DIR=smarttubetv/build/outputs/apk/stmobile/release" >> "$GITHUB_ENV"
          else
            ./gradlew :smarttubetv:assembleStmobileDebug
            echo "APK_DIR=smarttubetv/build/outputs/apk/stmobile/debug" >> "$GITHUB_ENV"
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube_Mobile_APKs
          path: ${{ env.APK_DIR }}/*.apk
          if-no-files-found: error

      - name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING_KEY == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_DIR }}/*.apk
          generate_release_notes: true
