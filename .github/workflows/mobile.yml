name: Build SmartTube Mobile

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publish the release on a version tag

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure release signing
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > "${{ github.workspace }}/key.jks"
          {
            echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "storeFile=${{ github.workspace }}/key.jks"
          } > keystore.properties

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew :smarttubetv:lintStmobileRelease

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: warn

      # Without the signing key the release APK can't be installed. Build the debug one instead.
      - name: Build APK
        run: |
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            ./gradlew :smarttubetv:assembleStmobileRelease
            echo "APK_DIR=smarttubetv/build/outputs/apk/stmobile/release" >> "$GITHUB_ENV"
          else
            ./gradlew :smarttubetv:assembleStmobileDebug
            echo "APK_DIR=smarttubetv/build/outputs/apk/stmobile/debug" >> "$GITHUB_ENV"
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube_Mobile_APKs
          path: ${{ env.APK_DIR }}/*.apk
          if-no-files-found: error

      # NOTE: upload the files one by one. Parallel uploads of the big APKs fail ("Error creating policy").
      - name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING_KEY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Use the release created on the website, or create a new one
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "SmartTube Mobile $TAG" --generate-notes
          fi

          for apk in "$APK_DIR"/*.apk; do
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$apk" --clobber; then
                uploaded=true
                break
              fi
              echo "Upload of $apk failed (attempt $attempt). Retrying..."
              sleep 15
            done
            if [ "$uploaded" != "true" ]; then
              echo "::error::Can't upload $apk"
              exit 1
            fi
          done

          (cd "$APK_DIR" && sha256sum *.apk > SHA256SUMS.txt)
          gh release upload "$TAG" "$APK_DIR/SHA256SUMS.txt" --clobber
